<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">KMP Spec-Driven Skills</title>
  <desc id="description">Design before code. Prove before claims.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090A16"/>
      <stop offset="0.52" stop-color="#11152A"/>
      <stop offset="1" stop-color="#071F25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B5CFF"/>
      <stop offset="0.48" stop-color="#627CFF"/>
      <stop offset="1" stop-color="#2FD7C4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C3CCFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#background)"/>
  <rect width="1280" height="640" rx="32" fill="url(#grid)"/>

  <circle cx="1038" cy="88" r="170" fill="#7C5CFF" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="1125" cy="535" r="220" fill="#2FD7C4" fill-opacity="0.12" filter="url(#glow)"/>

  <g transform="translate(76 68)">
    <rect width="162" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="25" cy="21" r="7" fill="#2FD7C4"/>
    <text x="43" y="27" fill="#DDE3FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" letter-spacing="1.2">OPEN SOURCE</text>

    <text x="0" y="130" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="760" letter-spacing="-2.4">KMP Spec-Driven</text>
    <text x="0" y="205" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="760" letter-spacing="-2.4">Skills</text>

    <text x="2" y="260" fill="#B8C1E6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="520">Design before code. Prove before claims.</text>

    <g transform="translate(0 326)">
      <rect width="430" height="126" rx="22" fill="url(#card)" stroke="#A68BFF" stroke-opacity="0.36"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#9B5CFF" fill-opacity="0.20" stroke="#B89AFF" stroke-opacity="0.55"/>
      <path d="M32 41h18M41 32v18" stroke="#C7B6FF" stroke-width="3" stroke-linecap="round"/>
      <text x="78" y="43" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">kmp-spec-driven-design</text>
      <text x="22" y="91" fill="#AEB8DA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Outcome → boundaries → RFC / ADR → plan</text>
    </g>

    <g transform="translate(456 326)">
      <rect width="430" height="126" rx="22" fill="url(#card)" stroke="#45D9CA" stroke-opacity="0.36"/>
      <rect x="20" y="20" width="42" height="42" rx="12" fill="#2FD7C4" fill-opacity="0.17" stroke="#54E7D7" stroke-opacity="0.50"/>
      <path d="M31 42l7 7 14-17" fill="none" stroke="#7AF4E7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="43" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">kmp-proof-of-parity</text>
      <text x="22" y="91" fill="#AEB8DA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Tests → targets → runtime → truthful claim</text>
    </g>

    <text x="0" y="512" fill="#7F8AB5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="0.6">github.com/SOSMex/kmp-spec-driven-skills</text>
  </g>

  <g transform="translate(1043 294)">
    <circle cx="0" cy="0" r="72" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <path d="M-35 -24h70M-35 0h70M-35 24h70" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-35" cy="-24" r="8" fill="#A77BFF"/>
    <circle cx="35" cy="0" r="8" fill="#6E88FF"/>
    <circle cx="-35" cy="24" r="8" fill="#35D8C7"/>
  </g>
</svg>
